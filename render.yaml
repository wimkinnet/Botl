# Render Blueprint: one Node web service that serves the API and the built React app.
# Set MONGODB_URI (and optionally APP_PASSWORD) in the Render dashboard; they are not stored in git.
services:
  - type: web
    name: botl
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: APP_PASSWORD
        sync: false
